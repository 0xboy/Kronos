# SPUS Base v1 — Colab Free (T4) paths under Google Drive
# Local twin: config_spus_base_v1.yaml
# Architecture: Kronos-base (~102M). Tokenizer frozen.
#
# Drive layout (same as small):
#   /content/drive/MyDrive/kronos/data/spus/*.csv
#   /content/drive/MyDrive/kronos/finetuned/spus_base_v1/...
#
# If OOM on T4: set batch_size to 4 (or accumulation_steps: 2).

data:
  data_path: "/content/drive/MyDrive/kronos/data/spus"
  lookback_window: 400
  predict_window: 1
  max_context: 512
  clip: 5.0
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0
  train_start: "2025-05-01"
  train_end: "2026-06-30"
  val_end: "2026-08-13"
  n_train_samples: 8000
  n_val_samples: 2000
  min_bars: 450

training:
  tokenizer_epochs: 0
  basemodel_epochs: 10
  batch_size: 4
  log_interval: 50
  num_workers: 0
  seed: 42
  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.00001
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 2

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-base"
  finetuned_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  exp_name: "spus_base_v1"
  base_path: "/content/drive/MyDrive/kronos/finetuned"
  base_save_path: ""
  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "spus_base_v1_colab"
  description: "SPUS Base v1 on Colab Free T4; tokenizer frozen; bs=4 accum=2"
  use_comet: false
  train_tokenizer: false
  train_basemodel: true
  skip_existing: false
  pre_trained_tokenizer: true
  pre_trained_predictor: true

device:
  use_cuda: true
  device_id: 0
