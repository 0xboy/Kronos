# SPUS Base v2 — Kronos-base predictor FT on SPUS100 daily (local twin of
# config_spus_base_v2_colab.yaml; see that file for the v1 -> v2 rationale).
# train window-end 2025-05-01..2026-05-15, val through 2026-06-30.
# Tokenizer frozen (Tokenizer-base). Architecture: Kronos-base (d_model=832, 12 layers).

data:
  data_path: "C:/project/kronos/data/yahoo_cache/spus"
  lookback_window: 400
  predict_window: 1
  max_context: 512
  clip: 5.0
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0
  # window-end calendar split (lookback may predate train_start)
  train_start: "2025-05-01"
  train_end: "2026-05-15"
  val_end: "2026-06-30"
  n_train_samples: 8000
  n_val_samples: 2000
  min_bars: 450

training:
  tokenizer_epochs: 0
  basemodel_epochs: 10
  batch_size: 8
  log_interval: 50
  num_workers: 0
  seed: 42
  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.00001
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 1
  loss_last_n: 1

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-base"
  finetuned_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  exp_name: "spus_base_v2"
  base_path: "C:/project/kronos/finetune_csv/finetuned"
  base_save_path: ""
  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "spus_base_v2"
  description: "SPUS Base v2 — loss_last_n=1; train 2025-05-01..2026-05-15, val through 2026-06-30"
  use_comet: false
  train_tokenizer: false
  train_basemodel: true
  skip_existing: false
  pre_trained_tokenizer: true
  pre_trained_predictor: true

device:
  use_cuda: true
  device_id: 0
